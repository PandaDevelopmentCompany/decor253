<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
</head>
<body>





<div class="slider-works">
  <div class="swiper">

    <div class="swiper-wrapper">

      <!-- Слайды -->
      <div class="swiper-slide">
        <a href="assets/img/work1.jpg" data-fancybox="gallery">
          <img src="assets/img/work1.jpg" alt="">
        </a>
      </div>

      <div class="swiper-slide">
        <a href="assets/img/work2.jpg" data-fancybox="gallery">
          <img src="assets/img/work2.jpg" alt="">
        </a>
      </div>

      <div class="swiper-slide">
        <a href="assets/img/work3.jpg" data-fancybox="gallery">
          <img src="assets/img/work3.jpg" alt="">
        </a>
      </div>

      <div class="swiper-slide">
        <a href="assets/img/work4.jpg" data-fancybox="gallery">
          <img src="assets/img/work4.jpg" alt="">
        </a>
      </div>

      <div class="swiper-slide">
        <a href="assets/img/work5.jpg" data-fancybox="gallery">
          <img src="assets/img/work5.jpg" alt="">
        </a>
      </div>

    </div>

    <!-- навигация -->
    <div class="swiper-button-prev"></div>
    <div class="swiper-button-next"></div>

    <!-- пагинация -->
    <div class="swiper-pagination"></div>

  </div>
</div>

<script>
  const swiperWorks = new Swiper(".slider-works .swiper", {
    loop: true,
    slidesPerView: 1,
    spaceBetween: 20,
    speed: 600,

    autoplay: {
        delay: 4000,
        disableOnInteraction: false,
    },

    navigation: {
        nextEl: ".slider-works .swiper-button-next",
        prevEl: ".slider-works .swiper-button-prev",
    },

    pagination: {
        el: ".slider-works .swiper-pagination",
        clickable: true,
    },

    breakpoints: {
        768: {
            slidesPerView: 2
        },
        1024: {
            slidesPerView: 3
        }
    }
});
</script>

<style>
  .slider-works {
  padding: 40px 0;
}

.slider-works img {
  width: 100%;
  height: 300px;
  object-fit: cover;
  border-radius: 12px;
  transition: 0.3s;
}

.slider-works a:hover img {
  transform: scale(1.05);
}

.swiper-button-prev,
.swiper-button-next {
  color: #d3ae8d;
}

.swiper-pagination-bullet-active {
  background: #d3ae8d;
}
</style>




</body>
</html>
